[package]
name = "insmv-web"
version.workspace = true
edition.workspace = true
description = "Interface Web de jeu et de suivi de campagne."

[dependencies]
insmv-regles = { path = "../regles" }
insmv-campagne = { path = "../campagne" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
