[package]
name = "insmv-mcp"
version.workspace = true
edition.workspace = true
description = "Serveur MCP du maître de jeu In Nomine Satanis / Magna Veritas."

[dependencies]
insmv-regles = { path = "../regles" }
rmcp = { version = "3.7", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
